<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WYGWYL Cinema Screening Room — Rendered Cuts</title>
<style>
  :root {
    --paper: #ffffff;
    --ink: #000000;
    --dim: #777777;
    --line: #000000;
    --blue: #0066cc;
    --soft: #f5f5f5;
    --red: #cf222e;
    --green: #1a7f37;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
  body { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--paper); color: var(--ink); }
  header { position: sticky; top: 0; z-index: 100; background: var(--paper); border-bottom: 2px solid var(--line); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; }
  .brand { font-size: 14px; font-weight: 900; letter-spacing: 0.08em; }
  
  .cut-selector { display: flex; gap: 4px; }
  .cut-btn { border: 1px solid var(--line); background: #fff; padding: 5px 10px; font-weight: 800; cursor: pointer; font-size: 11px; }
  .cut-btn:hover { background: var(--ink); color: #fff; }
  .cut-btn.active { background: var(--ink); color: #fff; }

  main { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(380px, 1fr); min-height: calc(100vh - 50px); }
  #screenCol { border-right: 2px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  #detailsCol { padding: 16px; background: var(--soft); overflow-y: auto; max-height: calc(100vh - 50px); }

  .video-frame { width: 100%; aspect-ratio: 16/9; background: #000; border: 2px solid var(--line); overflow: hidden; position: relative; }
  video { width: 100%; height: 100%; object-fit: contain; display: block; }

  .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 11px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  
  .card { border: 1px solid var(--line); background: #fff; padding: 12px; margin-bottom: 12px; }
  .card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; border-bottom: 1px solid var(--line); padding-bottom: 4px; margin-bottom: 8px; }

  .chapter-list { display: flex; flex-direction: column; gap: 4px; }
  .chapter-item { border: 1px solid var(--line); background: #fff; padding: 6px 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .chapter-item:hover { background: #e0efff; border-color: var(--blue); }
  .chapter-item b { font-size: 11px; }
  .chapter-item span { font-size: 10px; color: var(--dim); }

  .download-badge { padding: 3px 6px; background: var(--green); color: #fff; font-weight: 800; font-size: 10px; display: inline-block; }
</style>
</head>
<body>

<header>
  <div class="brand">🎬 WYGWYL CINEMA SCREENING ROOM</div>
  <div class="cut-selector">
    <button class="cut-btn active" id="btnDC" onclick="switchCut('dc')">14-POEM DIRECTOR'S CUT (94 MB)</button>
    <button class="cut-btn" id="btnHDR" onclick="switchCut('hdr')">HDR MASTER CUT (74 MB)</button>
    <button class="cut-btn" id="btn135" onclick="switchCut('135')">135-SHOT COMPLETE MASTER (402 MB)</button>
  </div>
  <div style="display:flex; gap:6px;">
    <a href="wygwyl-suite-player.html" class="cut-btn" target="_blank">SUITE PLAYER</a>
    <a href="wygwyl-coverage-matrix.html" class="cut-btn" target="_blank">COVERAGE MAP</a>
  </div>
</header>

<main>
  <section id="screenCol">
    <div class="video-frame">
      <video id="player" controls playsinline></video>
    </div>

    <div class="status-bar">
      <span style="font-weight:900;" id="cutTitle">WYGWYL 14-POEM DEFINITIVE DIRECTOR'S CUT</span>
      <a id="downloadLink" href="" download class="download-badge">⬇ DOWNLOAD MP4</a>
    </div>

    <div class="card">
      <h3>Active Cut Details</h3>
      <div style="font-size:11px; line-height:1.4;" id="cutDescription">Loading cut description...</div>
    </div>
  </section>

  <aside id="detailsCol">
    <div class="card">
      <h3>14 Poem-Film Jump Chapters</h3>
      <div class="chapter-list" id="chapterList"></div>
    </div>
  </aside>
</main>

<script>
const CUTS = {
  dc: {
    title: "WYGWYL 14-POEM DEFINITIVE DIRECTOR'S CUT",
    file: "rendered_cuts/WYGWYL_14POEM_DIRECTORS_CUT.mp4",
    size: "94.0 MB",
    desc: "The definitive storyboard-aligned 14-poem film sequence. Curated with the highest-fidelity visual assets, normalized to 1280x720 24fps with synchronized stereo audio design across 24 minutes."
  },
  hdr: {
    title: "WYGWYL KINETIC HDR MASTER CUT (ZERO DUPLICATES)",
    file: "rendered_cuts/WYGWYL_HDR_MASTER_CUT.mp4",
    size: "48.8 MB",
    desc: "CUTBASTARD-1 fast-paced kinetic HDR master cut. Zero replica scenes. 20 distinct visual archetypes carved into high-velocity 4s-5s bursts across all 14 halfworlds."
  },
  '135': {
    title: "WYGWYL 135-SHOT COMPLETE ZERO-REPEAT MASTER FILM",
    file: "rendered_cuts/WYGWYL_135SHOT_MASTER_CUT.mp4",
    size: "402.1 MB",
    desc: "The complete cinematic epic utilizing 100% of all 135 shots in the archive with zero repetition. Over 11 minutes of continuous, uninterrupted poetic footage."
  }
};

const CHAPTERS = [
  { n: "01", t: "OUT OF LIFE", sec: 0 },
  { n: "02", t: "FLASHING LIGHTS", sec: 123 },
  { n: "03", t: "HOW TO BREAK OFF AN ENGAGEMENT", sec: 214 },
  { n: "04", t: "NEVERMORE", sec: 286 },
  { n: "05", t: "BLOODLINES", sec: 422 },
  { n: "06", t: "RESURRECTING ATLANTIS", sec: 513 },
  { n: "07", t: "DJ TURN ME UP", sec: 623 },
  { n: "08", t: "NEWLY SINGLE", sec: 732 },
  { n: "09", t: "YET, HEARD", sec: 833 },
  { n: "10", t: "MAGIC RIDE", sec: 950 },
  { n: "11", t: "NEW DAY", sec: 1056 },
  { n: "12", t: "REUNION", sec: 1168 },
  { n: "13", t: "HOW TO WIN MY HEART", sec: 1243 },
  { n: "14", t: "HOT MINUTE", sec: 1352 }
];

const player = document.getElementById("player");

function switchCut(key) {
  const cut = CUTS[key];
  document.querySelectorAll(".cut-btn").forEach(b => b.classList.remove("active"));
  if (key === 'dc') document.getElementById("btnDC").classList.add("active");
  if (key === 'hdr') document.getElementById("btnHDR").classList.add("active");
  if (key === '135') document.getElementById("btn135").classList.add("active");

  document.getElementById("cutTitle").textContent = cut.title;
  document.getElementById("cutDescription").textContent = `${cut.desc} (Size: ${cut.size})`;
  document.getElementById("downloadLink").href = cut.file;
  document.getElementById("downloadLink").textContent = `⬇ DOWNLOAD MP4 (${cut.size})`;

  player.src = cut.file;
  player.play().catch(()=>{});
}

function buildChapters() {
  const box = document.getElementById("chapterList");
  box.innerHTML = "";
  CHAPTERS.forEach(ch => {
    const item = document.createElement("div");
    item.className = "chapter-item";
    const m = Math.floor(ch.sec / 60);
    const s = ch.sec % 60;
    const timeStr = String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");

    item.innerHTML = `
      <b>${ch.n} — ${ch.t}</b>
      <span>${timeStr}</span>
    `;
    item.onclick = () => {
      player.currentTime = ch.sec;
      player.play().catch(()=>{});
    };
    box.appendChild(item);
  });
}

buildChapters();
switchCut('dc');
</script>
</body>
</html>

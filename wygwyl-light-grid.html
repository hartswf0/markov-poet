<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WYGWYL 14-POEM BIN ORGANIZER</title>
<style>
  :root {
    --bg: #0d0d0d;
    --card: #161616;
    --border: #282828;
    --text: #ffffff;
    --dim: #888888;
    --blue: #0066cc;
    --green: #22c55e;
    --red: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
  body { background: var(--bg); color: var(--text); font: 12px/1.4 -apple-system, BlinkMacSystemFont, ui-monospace, monospace; padding: 0 0 60px 0; }

  /* Sticky Top Bar */
  header { position: sticky; top: 0; z-index: 100; background: #000; border-bottom: 2px solid var(--border); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; }
  .title { font-size: 14px; font-weight: 900; letter-spacing: 0.05em; }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  button, select { background: #1a1a1a; border: 1px solid #444; color: #fff; padding: 6px 12px; font: inherit; font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
  button:hover, select:hover { background: #fff; color: #000; border-color: #fff; }
  .btn-accent { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn-green { background: var(--green); border-color: var(--green); color: #000; font-weight: 900; }

  /* Navigation Anchors */
  .sub-bar { background: #111; padding: 8px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
  .jump-links { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0; }
  .jump-btn { background: #222; border: 1px solid #333; color: #aaa; padding: 2px 8px; font-size: 10px; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .jump-btn:hover { background: #fff; color: #000; }

  /* Main Container */
  .container { max-width: 1400px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 24px; }

  /* Section Titles */
  .section-heading { font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; border-bottom: 2px solid #333; padding-bottom: 6px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

  /* 14 Poem Bins Stack */
  .bins-grid { display: flex; flex-direction: column; gap: 16px; }
  .bin-box { background: var(--card); border: 1px solid var(--border); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .bin-box:hover { border-color: #555; }
  
  .bin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 6px; }
  .bin-title { font-size: 13px; font-weight: 900; }
  .bin-meta { font-size: 11px; color: var(--green); font-weight: 800; }

  /* Large Assigned Clips Row */
  .assigned-clips-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  
  .big-clip-card { background: #080808; border: 1px solid #333; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  .big-clip-card:hover { border-color: #fff; }
  .big-clip-thumb { width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; position: relative; }
  .big-clip-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .clip-overlay-time { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.85); padding: 2px 6px; font-size: 10px; font-weight: 800; color: var(--green); }
  
  .big-clip-details { padding: 8px; display: flex; flex-direction: column; gap: 4px; font-size: 11px; }
  .big-clip-details b { font-size: 12px; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .big-clip-details span { color: var(--dim); font-size: 10px; }
  
  .remove-clip-btn { background: #222; border: none; border-top: 1px solid #333; color: var(--red); padding: 6px 0; font-size: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
  .remove-clip-btn:hover { background: var(--red); color: #fff; }

  .empty-bin-placeholder { border: 2px dashed #333; padding: 20px; text-align: center; color: #555; font-weight: 800; font-size: 11px; text-transform: uppercase; }

  /* Master Asset Pool */
  .pool-controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .pool-search { flex: 1; min-width: 240px; background: #111; border: 1px solid #333; color: #fff; padding: 8px 12px; font: inherit; font-size: 12px; }
  
  .master-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  
  .pool-card { background: var(--card); border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .pool-card:hover { border-color: var(--blue); }
  .pool-thumb { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; overflow: hidden; }
  .pool-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pool-tag { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.85); border: 1px solid #444; font-size: 9px; font-weight: 800; padding: 2px 6px; }
  .pool-dur { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.85); font-size: 10px; font-weight: 800; padding: 2px 6px; color: var(--green); }

  .pool-body { padding: 10px; display: flex; flex-direction: column; gap: 4px; }
  .pool-body b { font-size: 12px; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pool-body p { font-size: 10px; color: var(--dim); line-height: 1.3; height: 26px; overflow: hidden; }

  .assign-dropdown-row { display: flex; gap: 4px; margin-top: 6px; }
  .bin-select { flex: 1; padding: 4px 6px; font-size: 10px; font-weight: 800; }
  .add-btn { padding: 4px 10px; font-size: 10px; font-weight: 800; background: var(--blue); border-color: var(--blue); color: #fff; }
</style>
</head>
<body>

<header>
  <div class="title">WYGWYL 14-POEM BIN ORGANIZER</div>
  <div class="header-actions">
    <span style="font-size:11px; color:#aaa;">TOTAL RUNTIME: <b id="totalRuntimeDisplay" style="color:var(--green);">00:00.0</b></span>
    <button onclick="autoFillDefault()">AUTO-FILL DEFAULT</button>
    <button onclick="clearAllBins()">CLEAR ALL</button>
    <button class="btn-accent" onclick="copyFFmpeg()">COPY FFMPEG</button>
    <button class="btn-green" onclick="copyEDL()">COPY EDL</button>
  </div>
</header>

<div class="sub-bar">
  <span>JUMP TO POEM BIN:</span>
  <div class="jump-links" id="jumpLinks"></div>
</div>

<div class="container">
  <!-- Section 1: The 14 Bins -->
  <div>
    <div class="section-heading">
      <span>1. The 14 Poem Bins (Assigned Large Clips)</span>
      <span style="font-size:11px; color:var(--dim); font-weight:400;">Scroll down to Pool to add clips</span>
    </div>
    <div class="bins-grid" id="binsContainer"></div>
  </div>

  <!-- Section 2: The Master Pool of 135 Clips -->
  <div id="poolSection">
    <div class="section-heading">
      <span>2. Master Asset Pool (All 135 Clips — Choose Bin & Add)</span>
      <span id="poolCountBadge" style="font-size:11px; color:var(--dim);">135 Clips Available</span>
    </div>

    <div class="pool-controls">
      <input type="text" class="pool-search" id="poolSearchInput" placeholder="Search 135 clips by keyword, archetype, prompt, location..." oninput="renderMasterPool()" />
      <select id="poolSortSelect" onchange="renderMasterPool()">
        <option value="default">Sort: Default Order</option>
        <option value="dur-desc">Duration (High ➔ Low)</option>
        <option value="dur-asc">Duration (Low ➔ High)</option>
        <option value="cat">Visual Archetype</option>
      </select>
    </div>

    <div class="master-grid" id="masterPoolGrid"></div>
  </div>
</div>

<script>
let POEMS = [];
let ALL_RECORDS = [];
let BINS = [];

async function init() {
  const [pRes, rRes, dcRes] = await Promise.all([
    fetch("WYGWYL_POEMS_MASTER.json"),
    fetch("LEGOS_MASTER_FRAMEWORK.json"),
    fetch("WYGWYL_DIRECTORS_CUT.json")
  ]);

  POEMS = (await pRes.json()).poems;
  ALL_RECORDS = (await rRes.json()).records;
  const dcData = await dcRes.json();

  BINS = POEMS.map((p, idx) => {
    const dcSuite = dcData.suites[idx];
    const initialClips = [];
    if (dcSuite) {
      dcSuite.curated_shots.forEach(sh => {
        const found = ALL_RECORDS.find(r => r.filename_stem === sh.filename_stem || r.id.startsWith(sh.shot_id.substring(0,8)));
        if (found) initialClips.push(found);
      });
    }
    return {
      num: p.number,
      title: p.title,
      verse: p.full_verse,
      clips: initialClips
    };
  });

  renderJumpLinks();
  renderBins();
  renderMasterPool();
}

function renderJumpLinks() {
  const jumpBox = document.getElementById("jumpLinks");
  jumpBox.innerHTML = "";
  POEMS.forEach(p => {
    const a = document.createElement("a");
    a.className = "jump-btn";
    a.href = `#bin_${p.number}`;
    a.textContent = `${p.number} ${p.title}`;
    jumpBox.appendChild(a);
  });
}

function renderBins() {
  const box = document.getElementById("binsContainer");
  box.innerHTML = "";

  let grandTotalSeconds = 0;

  BINS.forEach((b, bIdx) => {
    const binSec = b.clips.reduce((acc, c) => acc + parseFloat(c.duration_seconds || 5), 0);
    grandTotalSeconds += binSec;

    const binCard = document.createElement("div");
    binCard.className = "bin-box";
    binCard.id = `bin_${b.num}`;

    let clipsHtml = "";
    if (b.clips.length === 0) {
      clipsHtml = `<div class="empty-bin-placeholder">Empty Bin · Select a clip below and assign to Poem ${b.num}</div>`;
    } else {
      clipsHtml = `
        <div class="assigned-clips-row">
          ${b.clips.map((c, cIdx) => `
            <div class="big-clip-card">
              <div class="big-clip-thumb">
                <img src="contact_sheets/${c.filename_stem}_contact.jpg" loading="lazy" />
                <div class="clip-overlay-time">${c.duration_seconds || 5}s</div>
              </div>
              <div class="big-clip-details">
                <b>${c.visual_category}</b>
                <span>ID: ${c.id.substring(0,8)} · ${(c.has_audio_bool || c.has_audio) ? 'AUDIO' : 'SILENT'}</span>
              </div>
              <button class="remove-clip-btn" onclick="removeClipFromBin(${bIdx}, ${cIdx})">✕ Remove from Bin</button>
            </div>
          `).join('')}
        </div>
      `;
    }

    binCard.innerHTML = `
      <div class="bin-header">
        <div class="bin-title">POEM ${b.num} — ${b.title}</div>
        <div class="bin-meta">${binSec.toFixed(1)}s (${b.clips.length} clips assigned)</div>
      </div>
      <div style="font-size:11px; color:#aaa; font-style:italic; margin-bottom:4px;">“${b.verse}”</div>
      ${clipsHtml}
    `;

    box.appendChild(binCard);
  });

  const m = Math.floor(grandTotalSeconds / 60);
  const s = (grandTotalSeconds % 60).toFixed(1);
  document.getElementById("totalRuntimeDisplay").textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(4,'0')}`;
}

function renderMasterPool() {
  const grid = document.getElementById("masterPoolGrid");
  grid.innerHTML = "";
  const query = (document.getElementById("poolSearchInput").value || "").toLowerCase();
  const sortMode = document.getElementById("poolSortSelect").value;

  let filtered = ALL_RECORDS.filter(r => {
    if (!query) return true;
    const txt = `${r.filename_stem} ${r.visual_category} ${r.location_L} ${r.shift_S}`.toLowerCase();
    return txt.includes(query);
  });

  if (sortMode === 'dur-desc') {
    filtered.sort((a, b) => parseFloat(b.duration_seconds || 5) - parseFloat(a.duration_seconds || 5));
  } else if (sortMode === 'dur-asc') {
    filtered.sort((a, b) => parseFloat(a.duration_seconds || 5) - parseFloat(b.duration_seconds || 5));
  } else if (sortMode === 'cat') {
    filtered.sort((a, b) => (a.visual_category || '').localeCompare(b.visual_category || ''));
  }

  document.getElementById("poolCountBadge").textContent = `${filtered.length} Clips Available`;

  filtered.forEach(r => {
    const card = document.createElement("div");
    card.className = "pool-card";

    let binOptionsHtml = BINS.map((b, idx) => `<option value="${idx}">Poem ${b.num} — ${b.title}</option>`).join('');

    card.innerHTML = `
      <div class="pool-thumb">
        <img src="contact_sheets/${r.filename_stem}_contact.jpg" loading="lazy" />
        <div class="pool-tag">${r.visual_category}</div>
        <div class="pool-dur">${r.duration_seconds || 5}s</div>
      </div>
      <div class="pool-body">
        <b>${r.visual_category}</b>
        <p>${r.location_L || 'Location'} · ${r.shift_S || ''}</p>
        <div class="assign-dropdown-row">
          <select class="bin-select" id="select_${r.id}">
            ${binOptionsHtml}
          </select>
          <button class="add-btn" onclick="addClipToSelectedBin('${r.id}')">+ ADD</button>
        </div>
      </div>
    `;

    grid.appendChild(card);
  });
}

function addClipToSelectedBin(clipId) {
  const sel = document.getElementById(`select_${clipId}`);
  const binIdx = parseInt(sel.value, 10);
  const rec = ALL_RECORDS.find(r => r.id === clipId);

  if (rec && BINS[binIdx]) {
    BINS[binIdx].clips.push(rec);
    renderBins();
    // Scroll smoothly to the updated bin
    const binEl = document.getElementById(`bin_${BINS[binIdx].num}`);
    if (binEl) binEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function removeClipFromBin(binIdx, clipIdx) {
  BINS[binIdx].clips.splice(clipIdx, 1);
  renderBins();
}

function autoFillDefault() {
  init();
}

function clearAllBins() {
  BINS.forEach(b => b.clips = []);
  renderBins();
}

function copyFFmpeg() {
  let fileList = "";
  let clipCount = 0;
  BINS.forEach(b => {
    b.clips.forEach(c => {
      fileList += `file 'MARKOV_POET/videos/${c.filename_stem}.mp4'\n`;
      clipCount++;
    });
  });

  if (clipCount === 0) {
    alert("No clips in bins!");
    return;
  }

  const cmd = `cat << 'EOF' > /tmp/wygwyl_cut.txt\n${fileList}EOF\n\nffmpeg -y -f concat -safe 0 -i /tmp/wygwyl_cut.txt -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=24" -c:v libx264 -preset veryfast -crf 18 -pix_fmt yuv420p -c:a aac -b:a 192k -ar 48000 -ac 2 downloads/MARKOV_POET_ARCHIVE/rendered_cuts/WYGWYL_BIN_CUT.mp4\n`;

  navigator.clipboard.writeText(cmd);
  alert(`COPIED FFMPEG COMMAND FOR ${clipCount} CLIPS TO CLIPBOARD`);
}

function copyEDL() {
  let edl = `TITLE: WYGWYL_BIN_CONFORM_CUT\nFCM: NON-DROP FRAME\n\n`;
  let recSec = 3600;
  let eventNum = 1;

  BINS.forEach(b => {
    b.clips.forEach(c => {
      const dur = Math.round(parseFloat(c.duration_seconds || 5));
      const reel = c.id.substring(0,8).toUpperCase();
      const numStr = String(eventNum).padStart(3, '0');

      edl += `${numStr}  ${reel} V     C        00:00:00:00 ${formatSMPTE(dur)} ${formatSMPTE(recSec)} ${formatSMPTE(recSec + dur)}\n`;
      edl += `* FROM CLIP NAME: ${c.filename_stem}.mp4\n`;
      edl += `* POEM: ${b.num} ${b.title}\n\n`;

      recSec += dur;
      eventNum++;
    });
  });

  navigator.clipboard.writeText(edl);
  alert("COPIED CMX 3600 EDL TO CLIPBOARD");
}

function formatSMPTE(seconds) {
  const fps = 24;
  const totalFrames = Math.round(seconds * fps);
  const ff = totalFrames % fps;
  const totalSec = Math.floor(totalFrames / fps);
  const ss = totalSec % 60;
  const mm = Math.floor((totalSec / 60) % 60);
  const hh = 1 + Math.floor(totalSec / 3600);
  return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}:${String(ff).padStart(2,'0')}`;
}

init();
</script>
</body>
</html>

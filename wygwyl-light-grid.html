<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WYGWYL LIGHT GRID — 14 POEM CELLS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
  body { background: #000; color: #fff; font: 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; display: flex; flex-direction: column; height: 100vh; padding: 8px; gap: 8px; user-select: none; }

  header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 6px; }
  .title { font-weight: 900; letter-spacing: 0.08em; }
  .controls { display: flex; gap: 6px; align-items: center; }
  button { background: #111; border: 1px solid #333; color: #fff; padding: 4px 8px; font: inherit; font-size: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
  button:hover { background: #fff; color: #000; }
  button.active { background: #0066cc; color: #fff; border-color: #0066cc; }

  /* Main Workspace: 14 Poem Tracks on Left, 135 Thumbnails Pool on Right */
  main { flex: 1; display: grid; grid-template-columns: minmax(360px, 1.1fr) minmax(400px, 1fr); gap: 8px; min-height: 0; }

  /* Left: 14 Poem Tracks */
  #tracksContainer { background: #080808; border: 1px solid #222; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding: 6px; }
  .poem-track { background: #0e0e0e; border: 1px solid #222; display: flex; flex-direction: column; gap: 4px; padding: 6px; cursor: pointer; }
  .poem-track:hover { border-color: #444; }
  .poem-track.active-track { border-color: #0066cc; background: #111824; }
  
  .track-head { display: flex; justify-content: space-between; font-weight: 800; font-size: 10px; }
  .track-head .dur-badge { color: #22c55e; }
  
  .track-cells { display: flex; gap: 4px; overflow-x: auto; min-height: 52px; padding: 2px 0; align-items: center; }
  .plugged-chip { width: 80px; height: 48px; background: #000; border: 1px solid #333; position: relative; flex-shrink: 0; cursor: pointer; overflow: hidden; }
  .plugged-chip:hover { border-color: #ef4444; }
  .plugged-chip img { width: 100%; height: 100%; object-fit: cover; }
  .chip-dur { position: absolute; bottom: 2px; right: 2px; background: rgba(0,0,0,0.8); font-size: 8px; padding: 1px 3px; font-weight: 800; }
  .chip-del { position: absolute; top: 2px; right: 2px; background: #ef4444; color: #fff; font-size: 8px; width: 12px; height: 12px; display: none; align-items: center; justify-content: center; font-weight: 900; }
  .plugged-chip:hover .chip-del { display: flex; }
  .drop-hint { font-size: 9px; color: #444; text-transform: uppercase; padding: 4px; border: 1px dashed #222; width: 100%; text-align: center; }

  /* Right: 135 Thumbnails Pool */
  #poolContainer { background: #080808; border: 1px solid #222; display: flex; flex-direction: column; overflow: hidden; }
  .pool-head { background: #111; padding: 6px 8px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
  .pool-head input { background: #000; border: 1px solid #333; color: #fff; padding: 3px 6px; font: inherit; font-size: 10px; width: 180px; }
  
  #allThumbsGrid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 4px; padding: 6px; }
  .thumb-card { background: #000; border: 1px solid #222; aspect-ratio: 16/9; position: relative; cursor: pointer; overflow: hidden; }
  .thumb-card:hover { border-color: #0066cc; transform: scale(1.02); z-index: 10; }
  .thumb-card img { width: 100%; height: 100%; object-fit: cover; }
  .thumb-id { position: absolute; bottom: 2px; left: 2px; background: rgba(0,0,0,0.8); font-size: 7.5px; padding: 1px 3px; }
  .thumb-dur { position: absolute; bottom: 2px; right: 2px; background: rgba(0,0,0,0.8); font-size: 7.5px; padding: 1px 3px; color: #22c55e; }
</style>
</head>
<body>

<header>
  <div class="title">WYGWYL LIGHT GRID — 14 POEM CELLS</div>
  <div class="controls">
    <span style="font-size:10px; color:#888;">ACTIVE: <b id="activeTrackLabel" style="color:#fff;">01 OUT OF LIFE</b></span>
    <span style="font-size:10px; color:#888; margin-left:12px;">TOTAL RUNTIME: <b id="totalRuntime" style="color:#22c55e;">00:00.0</b></span>
    <button onclick="autoFillDefault()">AUTO-FILL</button>
    <button onclick="clearAllTracks()">CLEAR</button>
    <button onclick="copyFFmpeg()" style="background:#0066cc;">COPY FFMPEG</button>
    <button onclick="copyEDL()">COPY EDL</button>
  </div>
</header>

<main>
  <!-- Left: 14 Poem Tracks -->
  <div id="tracksContainer"></div>

  <!-- Right: 135 Thumbnails Pool -->
  <div id="poolContainer">
    <div class="pool-head">
      <span style="font-weight:800; font-size:10px;">ALL 135 THUMBNAILS (CLICK TO PLUG INTO ACTIVE POEM)</span>
      <input type="text" id="filterInput" placeholder="Filter thumbnails..." oninput="renderThumbnailsPool()" />
    </div>
    <div id="allThumbsGrid"></div>
  </div>
</main>

<script>
let POEMS = [];
let ALL_RECORDS = [];
let TRACKS = [];
let activeTrackIdx = 0;

async function init() {
  const [pRes, rRes, dcRes] = await Promise.all([
    fetch("WYGWYL_POEMS_MASTER.json"),
    fetch("LEGOS_MASTER_FRAMEWORK.json"),
    fetch("WYGWYL_DIRECTORS_CUT.json")
  ]);

  POEMS = (await pRes.json()).poems;
  ALL_RECORDS = (await rRes.json()).records;
  const dcData = await dcRes.json();

  TRACKS = POEMS.map((p, idx) => {
    const dcSuite = dcData.suites[idx];
    const initialClips = [];
    if (dcSuite) {
      dcSuite.curated_shots.forEach(sh => {
        const found = ALL_RECORDS.find(r => r.filename_stem === sh.filename_stem || r.id.startsWith(sh.shot_id.substring(0,8)));
        if (found) initialClips.push(found);
      });
    }
    return {
      num: p.number,
      title: p.title,
      clips: initialClips
    };
  });

  renderTracks();
  renderThumbnailsPool();
  selectTrack(0);
}

function selectTrack(idx) {
  if (idx < 0 || idx >= TRACKS.length) return;
  activeTrackIdx = idx;
  document.querySelectorAll(".poem-track").forEach((el, i) => el.classList.toggle("active-track", i === idx));
  document.getElementById("activeTrackLabel").textContent = `${TRACKS[idx].num} ${TRACKS[idx].title}`;
}

function renderTracks() {
  const box = document.getElementById("tracksContainer");
  box.innerHTML = "";

  let grandTotalSeconds = 0;

  TRACKS.forEach((tr, tIdx) => {
    const trackSec = tr.clips.reduce((acc, c) => acc + parseFloat(c.duration_seconds || 5), 0);
    grandTotalSeconds += trackSec;

    const el = document.createElement("div");
    el.className = "poem-track" + (tIdx === activeTrackIdx ? " active-track" : "");
    el.onclick = () => selectTrack(tIdx);

    let chipsHtml = "";
    if (tr.clips.length === 0) {
      chipsHtml = `<div class="drop-hint">+ CLICK ANY THUMBNAIL ON RIGHT TO PLUG HERE</div>`;
    } else {
      chipsHtml = tr.clips.map((c, cIdx) => `
        <div class="plugged-chip" onclick="event.stopPropagation(); removeClipFromTrack(${tIdx}, ${cIdx})" title="${c.visual_category} (${c.id.substring(0,8)})">
          <img src="contact_sheets/${c.filename_stem}_contact.jpg" />
          <span class="chip-dur">${c.duration_seconds || 5}s</span>
          <div class="chip-del">✕</div>
        </div>
      `).join('');
    }

    el.innerHTML = `
      <div class="track-head">
        <span>POEM ${tr.num} — ${tr.title}</span>
        <span class="dur-badge">${trackSec.toFixed(1)}s (${tr.clips.length} clips)</span>
      </div>
      <div class="track-cells">${chipsHtml}</div>
    `;

    box.appendChild(el);
  });

  const m = Math.floor(grandTotalSeconds / 60);
  const s = (grandTotalSeconds % 60).toFixed(1);
  document.getElementById("totalRuntime").textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(4,'0')}`;
}

function renderThumbnailsPool() {
  const grid = document.getElementById("allThumbsGrid");
  grid.innerHTML = "";
  const filter = (document.getElementById("filterInput").value || "").toLowerCase();

  const filtered = ALL_RECORDS.filter(r => {
    if (!filter) return true;
    const txt = `${r.filename_stem} ${r.visual_category} ${r.location_L} ${r.shift_S}`.toLowerCase();
    return txt.includes(filter);
  });

  filtered.forEach(r => {
    const card = document.createElement("div");
    card.className = "thumb-card";
    card.title = `${r.visual_category} | ${r.duration_seconds || 5}s (Click to plug into Poem ${TRACKS[activeTrackIdx].num})`;
    card.onclick = () => plugClipIntoActiveTrack(r);

    card.innerHTML = `
      <img src="contact_sheets/${r.filename_stem}_contact.jpg" loading="lazy" />
      <span class="thumb-id">${r.id.substring(0,8)}</span>
      <span class="thumb-dur">${r.duration_seconds || 5}s</span>
    `;

    grid.appendChild(card);
  });
}

function plugClipIntoActiveTrack(record) {
  TRACKS[activeTrackIdx].clips.push(record);
  renderTracks();
}

function removeClipFromTrack(tIdx, cIdx) {
  TRACKS[tIdx].clips.splice(cIdx, 1);
  renderTracks();
}

function autoFillDefault() {
  init();
}

function clearAllTracks() {
  TRACKS.forEach(t => t.clips = []);
  renderTracks();
}

function copyFFmpeg() {
  let fileList = "";
  let clipCount = 0;
  TRACKS.forEach(t => {
    t.clips.forEach(c => {
      fileList += `file 'MARKOV_POET/videos/${c.filename_stem}.mp4'\n`;
      clipCount++;
    });
  });

  if (clipCount === 0) {
    alert("No clips plugged into tracks!");
    return;
  }

  const cmd = `cat << 'EOF' > /tmp/wygwyl_cut.txt\n${fileList}EOF\n\nffmpeg -y -f concat -safe 0 -i /tmp/wygwyl_cut.txt -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=24" -c:v libx264 -preset veryfast -crf 18 -pix_fmt yuv420p -c:a aac -b:a 192k -ar 48000 -ac 2 downloads/MARKOV_POET_ARCHIVE/rendered_cuts/WYGWYL_CUSTOM_LIGHT_CUT.mp4\n`;

  navigator.clipboard.writeText(cmd);
  alert(`COPIED FFMPEG COMMAND FOR ${clipCount} PLUGGED CLIPS`);
}

function copyEDL() {
  let edl = `TITLE: WYGWYL_LIGHT_GRID_CUT\nFCM: NON-DROP FRAME\n\n`;
  let recSec = 3600;
  let eventNum = 1;

  TRACKS.forEach(t => {
    t.clips.forEach(c => {
      const dur = Math.round(parseFloat(c.duration_seconds || 5));
      const reel = c.id.substring(0,8).toUpperCase();
      const numStr = String(eventNum).padStart(3, '0');

      edl += `${numStr}  ${reel} V     C        00:00:00:00 ${formatSMPTE(dur)} ${formatSMPTE(recSec)} ${formatSMPTE(recSec + dur)}\n`;
      edl += `* FROM CLIP NAME: ${c.filename_stem}.mp4\n`;
      edl += `* POEM: ${t.num} ${t.title}\n\n`;

      recSec += dur;
      eventNum++;
    });
  });

  navigator.clipboard.writeText(edl);
  alert("COPIED CMX 3600 EDL TO CLIPBOARD");
}

function formatSMPTE(seconds) {
  const fps = 24;
  const totalFrames = Math.round(seconds * fps);
  const ff = totalFrames % fps;
  const totalSec = Math.floor(totalFrames / fps);
  const ss = totalSec % 60;
  const mm = Math.floor((totalSec / 60) % 60);
  const hh = 1 + Math.floor(totalSec / 3600);
  return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}:${String(ff).padStart(2,'0')}`;
}

init();
</script>
</body>
</html>

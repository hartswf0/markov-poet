<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WYGWYL CONFORM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
  body { background: #000; color: #fff; font: 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 12px; height: 100vh; display: flex; flex-direction: column; gap: 10px; user-select: none; }

  header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 8px; }
  .title { font-size: 11px; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase; color: #fff; }
  .actions { display: flex; gap: 6px; }
  button { background: #000; border: 1px solid #333; color: #fff; padding: 4px 8px; font: inherit; font-size: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
  button:hover { background: #fff; color: #000; }

  /* 14 Slots Row */
  #slotsRow { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; height: 130px; }
  .slot { background: #080808; border: 1px solid #222; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; }
  .slot.active { border-color: #fff; }
  .slot-bar { padding: 3px 4px; font-size: 9px; font-weight: 700; display: flex; justify-content: space-between; border-bottom: 1px solid #1a1a1a; background: #000; }
  .slot.active .slot-bar { background: #fff; color: #000; }
  .slot-img { flex: 1; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .slot-img img { width: 100%; height: 100%; object-fit: cover; }
  .slot-img span { font-size: 8px; color: #333; }
  .slot-del { padding: 2px 4px; font-size: 8px; color: #555; text-align: right; background: #000; }
  .slot-del:hover { color: #fff; }

  /* Status Bar */
  #statusBar { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 0.05em; display: flex; justify-content: space-between; border-bottom: 1px solid #1a1a1a; padding-bottom: 4px; }
  #statusBar b { color: #fff; }

  /* Candidate Grid */
  #candidateGrid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; overflow-y: auto; }
  .card { background: #080808; border: 1px solid #222; display: flex; flex-direction: column; cursor: pointer; position: relative; }
  .card:hover { border-color: #fff; }
  .card-img { width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; }
  .card-img img { width: 100%; height: 100%; object-fit: cover; }
  .card-info { padding: 4px; font-size: 9px; display: flex; justify-content: space-between; background: #000; border-top: 1px solid #1a1a1a; }
  .card-info b { color: #fff; }
  .card-info span { color: #888; }
</style>
</head>
<body>

<header>
  <div class="title">WYGWYL CONFORM — 14 SLOTS</div>
  <div class="actions">
    <button onclick="autoFill()">AUTO-FILL</button>
    <button onclick="clearAll()">CLEAR</button>
    <button onclick="exportFFmpeg()">EXPORT FFMPEG</button>
  </div>
</header>

<div id="slotsRow"></div>

<div id="statusBar">
  <span>ACTIVE: <b id="activeName">SLOT 01 — OUT OF LIFE</b></span>
  <span id="slotCount">14 / 14 FILLED</span>
</div>

<div id="candidateGrid"></div>

<script>
let POEMS = [];
let ALL_RECORDS = [];
let COVERAGE = [];
let SLOTS = [];
let activeIdx = 0;

async function init() {
  const [pRes, rRes, cRes] = await Promise.all([
    fetch("WYGWYL_POEMS_MASTER.json"),
    fetch("LEGOS_MASTER_FRAMEWORK.json"),
    fetch("WYGWYL_COVERAGE_MAP.json")
  ]);

  POEMS = (await pRes.json()).poems;
  ALL_RECORDS = (await rRes.json()).records;
  COVERAGE = (await cRes.json()).stanza_coverage_matrix;

  SLOTS = POEMS.map(p => ({
    num: p.number,
    title: p.title,
    assigned: null
  }));

  autoFill();
}

function autoFill() {
  SLOTS.forEach(s => {
    const list = getCandidates(s.num);
    if (list.length > 0) s.assigned = list[0].rec;
  });
  renderSlots();
  selectSlot(0);
}

function clearAll() {
  SLOTS.forEach(s => s.assigned = null);
  renderSlots();
  selectSlot(0);
}

function renderSlots() {
  const row = document.getElementById("slotsRow");
  row.innerHTML = "";
  let filled = 0;

  SLOTS.forEach((s, i) => {
    if (s.assigned) filled++;
    const el = document.createElement("div");
    el.className = "slot" + (i === activeIdx ? " active" : "");
    el.onclick = () => selectSlot(i);

    const thumb = s.assigned ? `contact_sheets/${s.assigned.filename_stem}_contact.jpg` : "";

    el.innerHTML = `
      <div class="slot-bar"><span>${s.num}</span><span>${s.assigned ? (s.assigned.duration_seconds || 5) + 'S' : ''}</span></div>
      <div class="slot-img">${s.assigned ? `<img src="${thumb}">` : `<span>EMPTY</span>`}</div>
      <div class="slot-del" onclick="event.stopPropagation(); clearSlot(${i})">${s.assigned ? 'CLR' : ''}</div>
    `;
    row.appendChild(el);
  });

  document.getElementById("slotCount").textContent = `${filled} / 14 FILLED`;
}

function selectSlot(i) {
  if (i < 0 || i >= SLOTS.length) return;
  activeIdx = i;
  const s = SLOTS[i];

  document.querySelectorAll(".slot").forEach((el, idx) => el.classList.toggle("active", idx === i));
  document.getElementById("activeName").textContent = `SLOT ${s.num} — ${s.title}`;
  renderCandidates(s.num);
}

function clearSlot(i) {
  SLOTS[i].assigned = null;
  renderSlots();
  selectSlot(i);
}

function assign(rec) {
  SLOTS[activeIdx].assigned = rec;
  renderSlots();
  if (activeIdx < SLOTS.length - 1) {
    selectSlot(activeIdx + 1);
  } else {
    selectSlot(activeIdx);
  }
}

function getCandidates(suiteNum) {
  const matching = COVERAGE.filter(st => st.suite_number === suiteNum);
  const out = [];
  const seen = new Set();

  matching.forEach(st => {
    st.allocated_shots.forEach(sh => {
      if (!seen.has(sh.shot_id)) {
        const rec = ALL_RECORDS.find(r => r.id === sh.shot_id || r.id.startsWith(sh.shot_id.substring(0,8)));
        if (rec) {
          out.push({ rec, prob: sh.match_probability || 85 });
          seen.add(sh.shot_id);
        }
      }
    });
  });

  // Fallback to pool if few
  ALL_RECORDS.forEach(r => {
    if (!seen.has(r.id) && out.length < 24) {
      out.push({ rec: r, prob: 50 });
      seen.add(r.id);
    }
  });

  out.sort((a, b) => b.prob - a.prob);
  return out;
}

function renderCandidates(suiteNum) {
  const grid = document.getElementById("candidateGrid");
  grid.innerHTML = "";

  const list = getCandidates(suiteNum);
  list.forEach(c => {
    const r = c.rec;
    const thumb = `contact_sheets/${r.filename_stem}_contact.jpg`;
    const el = document.createElement("div");
    el.className = "card";
    el.onclick = () => assign(r);

    el.innerHTML = `
      <div class="card-img"><img src="${thumb}" loading="lazy"></div>
      <div class="card-info"><b>${r.id.substring(0,8)}</b><span>${c.prob}%</span></div>
    `;
    grid.appendChild(el);
  });
}

function exportFFmpeg() {
  let txt = "";
  SLOTS.forEach(s => {
    if (s.assigned) txt += `file 'MARKOV_POET/videos/${s.assigned.filename_stem}.mp4'\n`;
  });

  const cmd = `cat << 'EOF' > /tmp/wygwyl_cut.txt\n${txt}EOF\nffmpeg -y -f concat -safe 0 -i /tmp/wygwyl_cut.txt -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=24" -c:v libx264 -preset veryfast -crf 18 -pix_fmt yuv420p -c:a aac -b:a 192k -ar 48000 -ac 2 downloads/MARKOV_POET_ARCHIVE/rendered_cuts/WYGWYL_CUSTOM_CUT.mp4\n`;

  navigator.clipboard.writeText(cmd);
  alert("COPIED FFMPEG CONFORM COMMAND");
}

init();
</script>
</body>
</html>
